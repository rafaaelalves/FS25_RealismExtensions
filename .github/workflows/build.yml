name: Build and test mod

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "perf/**"
      - "test/**"
      - "diag/**"
      - "chore/**"
      - "research/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 zip

      - name: Run harnesses
        run: |
          lua5.4 tests/state_contract_harness.lua
          lua5.4 tests/footprint_model_harness.lua
          lua5.4 tests/surface_response_harness.lua
          lua5.4 tests/terrain_response_model_harness.lua
          lua5.4 tests/spatial_history_harness.lua
          lua5.4 tests/terrain_persistence_harness.lua
          lua5.4 tests/soil_mass_transport_model_harness.lua
          lua5.4 tests/terrain_writer_harness.lua
          lua5.4 tests/terrain_deformation_engine_harness.lua
          lua5.4 tests/terrain_deformation_registration_harness.lua

      - name: Validate modDesc XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('modDesc.xml')"

      - name: Verify source declarations
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = ET.parse("modDesc.xml").getroot()
          missing = []
          for node in root.findall("./extraSourceFiles/sourceFile"):
              path = pathlib.Path(node.attrib["filename"])
              if not path.exists():
                  missing.append(str(path))
          icon = root.findtext("iconFilename")
          if not icon:
              missing.append("<iconFilename>")
          elif not pathlib.Path(icon).exists():
              missing.append(icon)
          if missing:
              raise SystemExit("Missing declared files: " + ", ".join(missing))
          PY

      - name: Build FS25 ZIP
        run: |
          rm -rf build
          mkdir -p build
          zip -r build/FS25_RealismExtensions.zip modDesc.xml icon.dds scripts \
            -x "*.DS_Store" "__MACOSX/*"

      - name: Verify ZIP root
        run: |
          unzip -l build/FS25_RealismExtensions.zip
          unzip -p build/FS25_RealismExtensions.zip modDesc.xml >/dev/null
          unzip -p build/FS25_RealismExtensions.zip icon.dds >/dev/null

      - name: Record build metadata
        run: |
          sha256sum build/FS25_RealismExtensions.zip | tee build/SHA256SUMS.txt
          {
            echo "### FS25 RealismExtensions test build"
            echo ""
            echo "- Branch: `${GITHUB_REF_NAME}`"
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Mod ZIP: `FS25_RealismExtensions.zip`"
            echo ""
            echo "Download the artifact attached to this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: FS25_RealismExtensions-${{ github.sha }}
          path: |
            build/FS25_RealismExtensions.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
