name: Build and test mod

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "perf/**"
      - "test/**"
      - "diag/**"
      - "chore/**"
      - "research/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 zip imagemagick

      - name: Build PTO dashboard texture
        run: |
          convert -background none -density 192 \
            scripts/pto/ui/pto_icon.svg \
            -resize 512x320 \
            -define dds:compression=dxt5 \
            scripts/pto/ui/pto_icon.dds
          test -s scripts/pto/ui/pto_icon.dds

      - name: Parse all Lua sources
        run: |
          find scripts tests -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Run harnesses
        run: |
          set -euo pipefail
          while IFS= read -r harness; do
            echo "::group::$harness"
            lua5.4 "$harness"
            echo "::endgroup::"
          done < <(find tests -maxdepth 1 -type f -name '*_harness.lua' | sort)

      - name: Validate XML
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('modDesc.xml')"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('scripts/pto/ui/pto_dashboardHud.xml')"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('scripts/pto/ui/pto_icon.svg')"

      - name: Verify source declarations
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = ET.parse("modDesc.xml").getroot()
          missing = []
          for node in root.findall("./extraSourceFiles/sourceFile"):
              path = pathlib.Path(node.attrib["filename"])
              if not path.exists():
                  missing.append(str(path))
          icon = root.findtext("iconFilename")
          if not icon:
              missing.append("<iconFilename>")
          elif not pathlib.Path(icon).exists():
              missing.append(icon)
          if missing:
              raise SystemExit("Missing declared files: " + ", ".join(missing))
          PY

      - name: Stamp build identity
        run: |
          cat > scripts/BuildInfo.lua <<EOF
          RealismExtensionsBuildInfo = {
              branch = "${GITHUB_REF_NAME}",
              commit = "${GITHUB_SHA}",
              runId = "${GITHUB_RUN_ID}",
              builtAtUtc = "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Build FS25 ZIP
        run: |
          rm -rf build
          mkdir -p build
          zip -r build/FS25_RealismExtensions.zip modDesc.xml icon.dds scripts \
            -x "*.DS_Store" "__MACOSX/*"

      - name: Verify ZIP root and identity
        run: |
          unzip -l build/FS25_RealismExtensions.zip
          unzip -p build/FS25_RealismExtensions.zip modDesc.xml >/dev/null
          unzip -p build/FS25_RealismExtensions.zip icon.dds >/dev/null
          unzip -p build/FS25_RealismExtensions.zip scripts/BuildInfo.lua | grep -F "$GITHUB_SHA"
          unzip -p build/FS25_RealismExtensions.zip scripts/BuildInfo.lua | grep -F "$GITHUB_REF_NAME"
          unzip -p build/FS25_RealismExtensions.zip scripts/pto/ui/pto_icon.dds >/dev/null
          unzip -p build/FS25_RealismExtensions.zip scripts/pto/ui/pto_dashboardHud.xml >/dev/null

      - name: Record build metadata
        run: |
          sha256sum build/FS25_RealismExtensions.zip | tee build/SHA256SUMS.txt
          {
            echo "### FS25 RealismExtensions test build"
            echo ""
            echo "- Branch: `${GITHUB_REF_NAME}`"
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Mod ZIP: `FS25_RealismExtensions.zip`"
            echo ""
            echo "Download the artifact attached to this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: FS25_RealismExtensions-${{ github.sha }}
          path: |
            build/FS25_RealismExtensions.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
