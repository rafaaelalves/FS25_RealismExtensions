name: Build and test mod

on:
  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
      - "research/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 zip

      - name: Run harnesses
        run: lua5.4 tests/state_contract_harness.lua

      - name: Validate modDesc XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('modDesc.xml')"

      - name: Verify source declarations
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = ET.parse("modDesc.xml").getroot()
          missing = []
          for node in root.findall("./extraSourceFiles/sourceFile"):
              path = pathlib.Path(node.attrib["filename"])
              if not path.exists():
                  missing.append(str(path))
          if missing:
              raise SystemExit("Missing source files: " + ", ".join(missing))
          PY

      - name: Build FS25 ZIP
        run: |
          rm -rf build
          mkdir -p build
          zip -r build/FS25_RealismExtensions.zip modDesc.xml scripts             -x "*.DS_Store" "__MACOSX/*"

      - name: Verify ZIP root
        run: |
          unzip -l build/FS25_RealismExtensions.zip
          unzip -p build/FS25_RealismExtensions.zip modDesc.xml >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: FS25_RealismExtensions
          path: build/FS25_RealismExtensions.zip
          if-no-files-found: error
